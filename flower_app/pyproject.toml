# Flower front-end for the same fedmed training code.
#   pip install -e ..[flower] && flwr run .            (simulation, 5 SuperNodes)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedmed-flower"
version = "0.1.0"
# fedmed-imaging is installed from the repo root (pip install -e ..). It is deliberately not listed
# here: Flower installs runtime dependencies from PyPI, and an unrelated PyPI project is named
# "fedmed" (dependency-confusion risk).
dependencies = ["flwr[simulation]>=1.20"]

[tool.hatch.build.targets.wheel]
packages = ["fedmed_flower"]

[tool.flwr.app]
publisher = "fedmed"

[tool.flwr.app.components]
serverapp = "fedmed_flower.server_app:app"
clientapp = "fedmed_flower.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
strategy = "fedprox"          # fedavg | fedprox
proximal-mu = 0.01
lr = 0.1
local-steps = 50
alpha = 0.5                   # Dirichlet label skew of the simulated hospitals
noise-multiplier = 0.0        # > 0 enables DP-SGD (Opacus) on every client
data-path = "data/raw/dermamnist.npz"


#######################################################################
